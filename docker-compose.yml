version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_ACCESS_SECRET=quiz_super_secret_access_key_2026_gamified
      - JWT_REFRESH_SECRET=quiz_super_secret_refresh_key_2026_gamified
    volumes:
      - sqlite_data:/app/prisma

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  sqlite_data:
