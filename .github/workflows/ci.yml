name: CI / Quality Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-server:
    name: Server Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client & Migrate DB
        run: |
          cd server
          npx prisma db push

      - name: Run Server Unit Tests
        run: |
          cd server
          npm test

      - name: Build Server
        run: |
          cd server
          npm run build

  test-client:
    name: Client Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: |
          cd client
          npm ci

      - name: Run Client Unit Tests
        run: |
          cd client
          npm test

      - name: Build Client
        run: |
          cd client
          npm run build
